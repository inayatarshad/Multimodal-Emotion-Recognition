default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Feature caches and checkpoints must never reach the repository.
        args: [--maxkb=1024]
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - torch
          - numpy
          - pydantic>=2.6
        args: [--strict, --ignore-missing-imports]

  - repo: local
    hooks:
      - id: no-committed-checkpoints
        name: reject committed model checkpoints
        entry: Checkpoints and feature caches belong in outputs/ and data/, not in git.
        language: fail
        files: '\.(ckpt|pt|pkl|h5|csd)$'
        exclude: '^tests/fixtures/'
